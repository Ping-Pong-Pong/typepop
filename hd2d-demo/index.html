<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>TypePop HD-2D — Pip's Cozy Corner</title>
<style>
  :root{
    --ink:#fff6e8;
    --chip:rgba(16,12,9,.55);
    --accent:#ffb45e;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:#171009;
    font-family:"Avenir Next","Segoe UI",system-ui,-apple-system,sans-serif;color:var(--ink)}
  #app{position:fixed;inset:0}
  #app canvas{display:block;width:100%;height:100%}

  /* ---------- loading veil ---------- */
  #loader{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;gap:14px;
    align-items:center;justify-content:center;background:radial-gradient(120% 120% at 50% 30%,#2c1f14 0%,#171009 70%);
    transition:opacity .8s ease}
  #loader.done{opacity:0;pointer-events:none}
  #loader .blob{width:74px;height:60px;border-radius:46% 46% 48% 48%/58% 58% 42% 42%;
    background:linear-gradient(180deg,#ff9d8a,#f2726b);position:relative;
    animation:bob 1.6s ease-in-out infinite;box-shadow:0 18px 30px rgba(0,0,0,.45)}
  #loader .blob::before{content:"";position:absolute;top:-13px;left:50%;width:5px;height:16px;
    background:#5da85f;border-radius:3px;transform:translateX(-50%) rotate(-8deg)}
  #loader .blob::after{content:"";position:absolute;top:-20px;left:56%;width:16px;height:10px;
    background:#6fbf73;border-radius:60% 20% 60% 20%;transform:rotate(24deg)}
  @keyframes bob{0%,100%{transform:translateY(0) scale(1,1)}50%{transform:translateY(-9px) scale(.97,1.04)}}
  #loader p{font-size:13px;letter-spacing:.28em;text-transform:uppercase;opacity:.65}

  /* ---------- HUD ---------- */
  #ui{position:fixed;inset:0;z-index:20;pointer-events:none;opacity:0;transition:opacity 1s ease .2s}
  #ui.on{opacity:1}
  .masthead{position:absolute;top:calc(14px + env(safe-area-inset-top));left:16px;
    background:var(--chip);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,.09);border-radius:14px;padding:10px 14px}
  .masthead h1{font-size:13px;font-weight:700;letter-spacing:.24em}
  .masthead h1 span{color:var(--accent)}
  .masthead p{font-size:11px;opacity:.62;margin-top:3px;letter-spacing:.06em}
  .hint{position:absolute;left:16px;bottom:calc(16px + env(safe-area-inset-bottom));
    font-size:11.5px;letter-spacing:.08em;opacity:.6;background:var(--chip);
    border:1px solid rgba(255,255,255,.08);padding:8px 12px;border-radius:999px;
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}

  /* ---------- day/night toggle ---------- */
  #dnToggle{position:absolute;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));
    pointer-events:auto;cursor:pointer;border:1px solid rgba(255,255,255,.12);
    background:var(--chip);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    border-radius:999px;padding:6px;display:flex;align-items:center;gap:2px;color:var(--ink)}
  #dnToggle .opt{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:600;
    letter-spacing:.1em;padding:8px 14px;border-radius:999px;opacity:.45;transition:all .35s ease}
  #dnToggle .opt .dot{width:14px;height:14px;border-radius:50%;flex:none}
  #dnToggle .opt.day .dot{background:radial-gradient(circle at 35% 35%,#ffe9b0,#ff9d3c);
    box-shadow:0 0 10px rgba(255,170,60,.8)}
  #dnToggle .opt.night .dot{background:radial-gradient(circle at 35% 35%,#dfe9ff,#7d94c9);
    box-shadow:0 0 10px rgba(150,180,255,.8)}
  #dnToggle .opt.active{opacity:1;background:rgba(255,255,255,.1)}
  #dnToggle:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

  #fallback{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;
    text-align:center;padding:32px;background:#171009}

  /* ---------- error toast (diagnostics on phone) ---------- */
  #errtoast{position:fixed;left:12px;right:12px;top:calc(10px + env(safe-area-inset-top));z-index:60;
    display:none;background:rgba(120,20,20,.92);color:#fff;font-size:12px;line-height:1.45;
    padding:10px 12px;border-radius:10px;word-break:break-word}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="app"></div>

<div id="loader">
  <div class="blob"></div>
  <p>warming up the diorama</p>
</div>

<div id="ui">
  <div class="masthead">
    <h1>TYPEPOP <span>·</span> HD-2D</h1>
    <p>Pip's cozy corner &mdash; tech demo</p>
  </div>
  <div class="hint">drag to look around &nbsp;·&nbsp; tap Pip</div>
  <button id="dnToggle" aria-label="Toggle day and night">
    <span class="opt day active"><span class="dot"></span>DAY</span>
    <span class="opt night"><span class="dot"></span>NIGHT</span>
  </button>
</div>

<div id="fallback"><p>This demo needs WebGL.<br>Please open it in a recent Chrome, Safari or Edge.</p></div>
<div id="errtoast"></div>
<script>
/* boot watchdog: if the 3D module never starts (e.g. CDN blocked),
   say so instead of sitting on a black screen forever */
setTimeout(function () {
  if (!window.__hd2d_booted) {
    var t = document.getElementById('errtoast');
    t.style.display = 'block';
    t.dataset.watchdog = '1';
    t.textContent = 'Still loading after 12s — the 3D library (jsdelivr CDN) may be blocked on this network.';
  }
}, 12000);
</script>

<script type="module" src="./js/main.js?v=2"></script>
</body>
</html>
