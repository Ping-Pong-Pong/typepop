<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>All 16 personality types — TypePop</title>
<meta name="description" content="Browse all 16 TypePop personality types — strengths, watch-outs, and famous lookalikes.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎭</text></svg>">
</head>
<body class="lang-en">
<header class="site-header">
  <div class="wrap">
    <a class="logo" href="index.html">Type<span>Pop</span> 🎭</a>
    <nav class="site-nav">
      <a href="index.html" data-i18n="nav_home">Home</a>
      <a href="types.html" data-i18n="nav_types">16 Types</a>
      <a href="about.html" data-i18n="nav_about">About</a>
    </nav>
    <div class="lang-toggle" role="group" aria-label="Language">
      <button data-lang="en" class="active">EN</button>
      <button data-lang="ko">한국어</button>
    </div>
  </div>
</header>

<main>
  <div class="wrap">
    <section class="section">
      <h2 data-i18n="all_types_t">All 16 personality types</h2>
      <p class="lede" data-i18n="all_types_d">Tap any card for strengths, watch-outs, and famous lookalikes.</p>
      <div class="type-grid" id="typeGrid"></div>
      <div class="btn-row">
        <a class="btn btn-primary" href="quiz.html" data-i18n="cta_start">Find my type 🚀</a>
      </div>
    </section>
  </div>
</main>

<footer>
  <div class="wrap">
    <div class="flinks">
      <a href="about.html" data-i18n="nav_about">About</a>
      <a href="privacy.html">Privacy</a>
      <a href="contact.html">Contact</a>
    </div>
    <p data-i18n="footer_tag">Made for group chats everywhere.</p>
    <p data-i18n="footer_rights">© 2026 TypePop · For fun &amp; self-reflection — not a clinical instrument.</p>
  </div>
</footer>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
  function renderGrid() {
    var grid = document.getElementById('typeGrid');
    var lang = window.TP.getLang();
    grid.innerHTML = '';
    (window.TP_TYPES || []).forEach(function (tp) {
      var a = document.createElement('a');
      a.className = 'type-card';
      a.href = 'type.html?code=' + tp.code;
      a.innerHTML = '<div class="code"><span class="type-dot" style="background:' +
        window.TP.typeColor(tp.code) + '"></span>' + tp.code + '</div>' +
        '<div class="tname">' + (tp.name[lang] || tp.name.en) + '</div>' +
        '<div class="tname" style="font-weight:400;font-size:.8rem">' + (tp.tagline[lang] || tp.tagline.en) + '</div>';
      grid.appendChild(a);
    });
  }
  renderGrid();
  window.__onLangChange = renderGrid;
});
</script>
</body>
</html>
